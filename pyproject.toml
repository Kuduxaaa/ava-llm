[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ava-llm"
version = "0.2.0"
description = "A from-scratch language-model framework: transformer, Mamba and hybrid stacks in pure PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nika Kudukhashvili" }]
keywords = ["llm", "transformer", "mamba", "state-space-model", "pytorch", "pretraining"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
tokenizer = ["sentencepiece>=0.2"]
data = ["datasets>=2.18", "huggingface_hub>=0.22"]
safetensors = ["safetensors>=0.4"]
plotting = ["matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
all = [
    "ava-llm[tokenizer,data,safetensors,plotting]",
]

[project.urls]
Homepage = "https://github.com/Kuduxaaa/ava-llm"
Issues = "https://github.com/Kuduxaaa/ava-llm/issues"

[tool.hatch.build.targets.wheel]
packages = ["ava"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:ava.*",
]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument
    "RUF012", # mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"ava/model/__init__.py" = ["F401"]
"ava/__init__.py" = ["F401"]

[tool.coverage.run]
source = ["ava"]
omit = ["*/tests/*"]
